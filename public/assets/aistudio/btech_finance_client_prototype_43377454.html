dth:88px;border-radius:50%;margin:0 auto 20px;display:grid;place-items:center;background:radial-gradient(circle,#1a5d56,#142633);font-size:35px;color:var(--teal);border:1px solid #28685f}.tabbar{display:flex;gap:5px;padding:5px;border-radius:14px;background:#0b1420;border:1px solid var(--line)}.tabbar button{flex:1;background:transparent;color:var(--muted);height:36px;border-radius:10px;font-size:10px;font-weight:800}.tabbar button.active{background:var(--teal);color:#05211d}.market{display:flex;align-items:center;gap:11px;padding:12px;border:1px solid var(--line);background:var(--surface);border-radius:14px;margin:9px 0}.market-icon{height:38px;width:38px;border-radius:11px;background:var(--surface3);display:grid;place-items:center;color:var(--teal);font-size:12px;font-weight:800}.market-main{flex:1;min-width:0}.market-main strong{display:block;font-size:12px}.market-main small{display:block;color:var(--muted);font-size:9px;margin-top:4px}.market .plus{color:var(--teal);font-size:20px}.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.info-cell{padding:12px;background:#0b1520;border:1px solid var(--line);border-radius:12px}.info-cell small{display:block;color:var(--muted);font-size:9px;margin-bottom:6px}.info-cell strong{font-size:11px}.broker{display:flex;align-items:center;gap:11px;padding:12px;border-radius:15px;border:1px solid var(--line);background:var(--surface);margin:9px 0;width:100%;text-align:left;color:var(--text)}.broker-logo{height:43px;width:43px;border-radius:12px;background:var(--surface3);display:grid;place-items:center;color:var(--teal);font-weight:900;font-size:13px}.broker-copy{flex:1;min-width:0}.broker-copy strong{display:block;font-size:12px}.broker-copy small{display:block;color:var(--muted);font-size:9px;margin-top:4px}.server-tag{font-size:9px;color:var(--muted);background:var(--surface3);padding:6px 8px;border-radius:20px}

.seg{display:flex;gap:6px}.seg button{flex:1;height:37px;border-radius:11px;background:var(--surface3);color:var(--muted);font-size:10px;font-weight:800;border:1px solid var(--line)}.seg button.active{background:var(--teal-d);border-color:#237a6b;color:var(--teal)}.terminal{background:#0b1420;border:1px solid var(--line);border-radius:15px;padding:11px;overflow:hidden}.chart{height:135px;position:relative;background:linear-gradient(180deg,#0d1a28,#101b28);border-radius:8px;margin:10px 0;border:1px solid #25394b;overflow:hidden}.chart:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 25px,#24384a 26px),repeating-linear-gradient(90deg,transparent 0 37px,#24384a 38px);opacity:.6}.chart svg{position:relative;width:100%;height:100%}.float-bubble{position:fixed;right:max(calc((100vw - 440px)/2 + 22px),22px);bottom:110px;height:54px;width:54px;border-radius:50%;background:linear-gradient(145deg,#23e1bc,#078b7a);color:#04221d;box-shadow:0 7px 25px #18d2b077;display:none;place-items:center;font-weight:900;font-size:20px;z-index:19;border:2px solid #a2f6e8}.float-bubble.show{display:grid}.modal-backdrop{position:fixed;inset:0;background:#030910c9;z-index:30;display:none;align-items:center;justify-content:center;padding:20px}.modal-backdrop.show{display:flex}.modal{width:min(100%,390px);background:#172637;border:1px solid #3a5266;border-radius:23px;padding:22px;box-shadow:var(--shadow)}.modal-icon{height:64px;width:64px;border-radius:50%;margin:0 auto 16px;display:grid;place-items:center;background:var(--green-d);color:var(--green);font-size:28px}.modal h3{font-size:18px;text-align:center;margin:0 0 9px}.modal p{text-align:center;color:var(--muted);font-size:11px;line-height:1.5;margin:0 0 18px}.timeline{display:flex;gap:10px;align-items:flex-start;margin:11px 0}.timeline-dot{height:9px;width:9px;border-radius:50%;background:var(--green);margin-top:4px;flex:none;box-shadow:0 0 0 4px #41d39a18}.timeline-copy{font-size:10px;line-height:1.35}.timeline-copy small{display:block;color:var(--muted);font-size:9px;margin-top:3px}.toast{position:fixed;z-index:45;left:50%;transform:translateX(-50%);bottom:93px;background:#183d34;color:#a8ffdf;border:1px solid #2c8b6a;padding:12px 16px;border-radius:14px;font-size:11px;font-weight:800;box-shadow:var(--shadow);display:none;white-space:nowrap}.toast.show{display:block}.toast.error{background:#4a1720;color:#ffe2e5;border:1px solid #dc3545;box-shadow:0 8px 24px #dc354544}.palette{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;padding:14px}.swatch{height:40px;border-radius:50%;border:2px solid transparent}.swatch.active{outline:2px solid var(--text);outline-offset:3px}.demo-note{background:#2a2519;border:1px solid #68532a;color:#eac981;padding:10px 12px;border-radius:12px;font-size:9px;line-height:1.45;margin-top:13px}.hidden{display:none!important}

/* BTECH refinement: full-interface themes, broker configuration and movable overlay */
:root{--btn-text:#06211d;--card-bg:linear-gradient(155deg,var(--surface2),var(--surface));--input-bg:var(--bg)}
body{background:radial-gradient(ellipse at 50% -20%,color-mix(in srgb,var(--teal) 17%,var(--bg)) 0,var(--bg) 58%);color:var(--text);transition:background .2s,color .2s}
.card{background:var(--card-bg);border-color:var(--line)}
.input,select{background:var(--input-bg);color:var(--text);border-color:var(--line)}
.nav{background:color-mix(in srgb,var(--surface) 94%,transparent);border-color:var(--line)}
.tabbar{background:var(--surface);border-color:var(--line)}
.tabbar button.active,.nav button.add,.btn,.btn.green{background:var(--teal);color:var(--btn-text);border-color:var(--teal)}
.btn.ghost,.link{color:var(--teal)}
.btn.ghost{border-color:color-mix(in srgb,var(--teal) 60%,transparent)}
.btn.secondary{background:var(--surface3);color:var(--text);border-color:var(--line)}
.btn.green{box-shadow:0 5px 18px color-mix(in srgb,var(--teal) 22%,transparent)}
.topicon,.market,.broker,.info-cell,.terminal,.chart,.tabbar,.input,select{background-color:var(--surface)}
.empty-orb{background:radial-gradient(circle,color-mix(in srgb,var(--teal) 34%,var(--surface)),var(--surface));border-color:color-mix(in srgb,var(--teal) 55%,var(--line))}
.brandmark{background:linear-gradient(135deg,var(--teal),color-mix(in srgb,var(--teal) 65%,#08201d));box-shadow:0 5px 20px color-mix(in srgb,var(--teal) 30%,transparent)}
.float-bubble{background:var(--teal);color:var(--btn-text);border-color:color-mix(in srgb,var(--teal) 48%,white);box-shadow:0 7px 25px color-mix(in srgb,var(--teal) 48%,transparent);touch-action:none;cursor:grab;user-select:none}
.float-bubble:active{cursor:grabbing}
.float-panel{position:fixed;z-index:34;width:min(360px,calc(100vw - 24px));max-height:min(72vh,620px);overflow:auto;left:12px;top:120px;display:none;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 55px #0008;padding:0;overscroll-behavior:contain}
.float-panel.show{display:block}
.float-panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 15px;background:var(--surface2);border-bottom:1px solid var(--line);border-radius:18px 18px 0 0;cursor:grab;touch-action:none;user-select:none}
.float-panel-head:active{cursor:grabbing}
.float-panel-head strong{font-size:12px;letter-spacing:.04em}
.float-panel-body{padding:13px}
.float-panel-close{height:30px;width:30px;border-radius:10px;background:var(--surface3);color:var(--text);font-size:18px}
.drag-hint{font-size:9px;color:var(--muted);padding:0 15px 9px;background:var(--surface2)}
.server-select-wrap{position:relative}
.server-note{border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:10px 12px;font-size:10px;line-height:1.45;color:var(--muted);margin-top:8px}
.server-url{font-size:9px;color:var(--teal);word-break:break-all;margin-top:5px}
.theme-mode{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.theme-mode button{height:42px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);color:var(--text);font-size:11px;font-weight:800}
.theme-mode button.active{background:var(--teal);border-color:var(--teal);color:var(--btn-text)}
.palette{grid-template-columns:repeat(4,1fr)}
.swatch{cursor:pointer}
.custom-colour-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border:1px solid var(--line);border-radius:13px;background:var(--surface2);margin-top:12px}
.custom-colour-row input[type=color]{height:42px;width:62px;border:0;background:transparent;cursor:pointer;padding:0}
:root[data-theme="light"]{--bg:#f2f5f9;--surface:#ffffff;--surface2:#edf2f7;--surface3:#e2e9f0;--line:#d0d9e3;--text:#182534;--muted:#627386;--teal-d:color-mix(in srgb,var(--teal) 15%,white);--green-d:#e2f6ed;--red-d:#ffeaec;--amber-d:#fff2d9;--card-bg:#ffffff;--input-bg:#ffffff;--btn-text:#10202e;--shadow:0 16px 38px #26384b22}
:root[data-theme="light"] body{background:radial-gradient(ellipse at 50% -20%,color-mix(in srgb,var(--teal) 12%,white),var(--bg) 60%)}
:root[data-theme="light"] .nav{background:color-mix(in srgb,var(--surface) 94%,transparent);box-shadow:0 12px 30px #34465a22}
:root[data-theme="light"] .modal{background:var(--surface);border-color:var(--line)}
:root[data-theme="light"] .float-panel{box-shadow:0 18px 55px #34465a33}
:root[data-theme="light"] .info-cell{background:var(--surface2)}
:root[data-theme="light"] .terminal,:root[data-theme="light"] .chart{background:var(--surface2)}
@media(max-width:380px){.float-panel{max-height:68vh}.float-panel-body{padding:10px}.float-panel .btnrow{flex-direction:column}}

@media(min-width:600px){body{padding:20px 0}#shell{border:1px solid #263a4d;border-radius:34px;min-height:860px;box-shadow:var(--shadow);background:var(--bg)}.nav{position:absolute;bottom:16px}}

/* BTECH home screen + navigation refinement (v3) */
:root{--nav-strip:#e9e9ee;--nav-stroke:#fff;--hero-fade:var(--bg);--accent-soft:color-mix(in srgb,var(--teal) 14%,transparent)}
:root[data-theme="dark"]{--nav-strip:#22232a;--nav-stroke:#fff}
:root[data-theme="light"]{--nav-strip:#ececf1;--nav-stroke:#fff}
body{background:var(--bg);color:var(--text)}
#shell{overflow:visible}
/* Full-bleed hero artwork occupies approximately the upper half of the phone. */
.robot-hero{position:relative;width:calc(100% + 30px);height:50svh;min-height:285px;max-height:440px;margin:0 -15px 0;overflow:hidden;background:var(--surface2);isolation:isolate}
.robot-hero img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 42%;}
.robot-hero:after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.03) 35%,rgba(0,0,0,.18) 64%,color-mix(in srgb,var(--bg) 96%,transparent) 100%);}
.robot-hero:before{content:"";position:absolute;inset:0;z-index:0;background:radial-gradient(ellipse at 50% 40%,color-mix(in srgb,var(--teal) 12%,transparent),transparent 65%);pointer-events:none;mix-blend-mode:soft-light}
.robot-art-compact{height:170px;position:relative;overflow:hidden;border-radius:13px;background:var(--surface2)}
.robot-art-compact img{width:100%;height:100%;object-fit:cover;object-position:center 42%;display:block}
.robot-art-compact:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,.72));pointer-events:none}
.robot-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:13px 0 14px}
.robot-actions button{height:46px;min-height:46px;border-radius:8px!important;padding:8px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:10px;letter-spacing:.035em}
.robot-actions button .action-icon{height:25px;display:grid;place-items:center}
.robot-actions button .action-label{display:block;line-height:1}
.robot-actions .action-primary{background:var(--teal);color:var(--btn-text);border:1px solid var(--teal);box-shadow:0 5px 18px color-mix(in srgb,var(--teal) 24%,transparent)}
.robot-actions .action-secondary{background:var(--surface);color:var(--text);border:1px solid var(--line);box-shadow:none}
.robot-summary{background:var(--surface);border-color:var(--line);border-radius:14px;padding:12px}
.robot-summary .thumb{height:54px;width:54px;border-radius:50%;overflow:hidden;border:2px solid var(--line);background:var(--surface2)}
.robot-summary .thumb img{height:100%;width:100%;object-fit:cover}
/* Reference-style bottom navigation: grey top rail, active indicator, white/light body. */
.nav{height:82px;bottom:calc(env(safe-area-inset-bottom) + 8px);width:min(calc(100% - 24px),414px);padding:0;border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:0 14px 35px #0003;display:block;overflow:visible;backdrop-filter:blur(16px)}
.nav-cap{height:13px;position:absolute;left:0;right:0;top:0;border-radius:20px 20px 0 0;background:var(--nav-strip);overflow:hidden}
.nav-active-marker{position:absolute;left:0;top:11px;height:2px;width:20%;background:var(--teal);transition:left .2s ease,width .2s ease}
.nav-items{height:100%;padding:13px 7px 5px;display:flex;align-items:center;justify-content:space-around;position:relative;z-index:1}
.nav button.nav-tab{height:64px;min-width:0;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:transparent;color:var(--muted);border-radius:0;font-size:9px;font-weight:650;padding:0;position:relative}
.nav button.nav-tab .nav-icon-wrap{height:39px;width:39px;border-radius:50%;display:grid;place-items:center;color:currentColor;background:transparent;border:2px solid transparent;transition:background .2s,border-color .2s,transform .2s;}
.nav button.nav-tab .nav-label{line-height:1.1;display:block;color:inherit}
.nav button.nav-tab.active{background:transparent;color:var(--teal)}
.nav button.nav-tab.active .nav-icon-wrap{background:var(--surface);border:2px solid var(--nav-stroke);box-shadow:0 2px 9px color-mix(in srgb,var(--teal) 15%,transparent),0 0 0 1px var(--line);}
.nav button.nav-tab.add{flex:1;min-width:0;height:64px;background:transparent;color:var(--text);border-radius:0;font-size:9px;box-shadow:none}
.nav button.nav-tab.add .nav-icon-wrap{height:56px;width:56px;border-radius:50%;transform:translateY(-15px);background:var(--teal);color:var(--btn-text);border:3px solid var(--surface);box-shadow:0 5px 16px color-mix(in srgb,var(--teal) 35%,transparent);}

function toggleBot(){
 if(!state.running){
  if(!state.allowed.length){toast('Choose a symbol to trade first','error');return}
  if(!state.saved||!String(state.saved.login||'').trim()){
   toast('Please set your login details','error');return
  }
  state.running=true;state.execution='idle';startNativeOverlay();toast('Robot started — floating monitor enabled');
 }else{
  state.running=false;state.execution='idle';stopNativeOverlay();$('floatBubble').classList.remove('show');closeFloat();toast('Robot stopped');
 }
 render();
}
function openFloat(){
 const root=$('floatPanel');
 const src=state.artworkUrl||demoArtworkData;
 const lines=state.profitReady
  ? `<div>>> LIVE: STARTED</div><div>>> SERVER: ${state.botServer}</div><div>>> SYMBOL: XAUUSD · 4 POSITIONS</div><div class="log-good">>> DONE 4/4 EXECUTED</div><div class="log-good">>> FLOATING P/L: +$18.42</div><div class="log-warn">>> DEMO VALUE — LIVE BROKER FEED NOT CONNECTED</div>`
  : `<div>>> LIVE: ${state.running?'STARTED':'STOPPED'}</div><div>>> SERVER: ${state.botServer}</div><div>>> SIGNAL CHANNEL: CONNECTED</div><div>>> WAITING FOR SIGNAL...</div><div>>> SYMBOL: XAUUSD</div><div>>> TP 0849.9 · SL 49484.8</div><div class="log-good">>> EXECUTION MONITOR READY</div>`;
 root.innerHTML=`<div class="float-panel-hero" id="floatPanelHandle"><img src="${src}" alt="EA image"><div class="float-panel-title"><strong>${escapeHtml(state.botName)}</strong><div class="owner">${escapeHtml(state.botOwner)}</div></div><div class="float-panel-copy"><div class="connection"><i></i> Server: Connected · ${state.botServer}</div></div><button class="float-panel-close" onclick="closeFloat()" aria-label="Close floating monitor">×</button></div>
 <div class="float-panel-controls"><button class="float-skip" onclick="toggleSkipTrading()">${state.skipTrading?'RESUME TRADING':'SKIP TRADES'}</button><button class="float-logs-toggle" onclick="toggleFloatLogs()">${iconSvg('log',14)} <span>${state.logsVisible?'HIDE LOGS':'SHOW LOGS'}</span></button><span class="float-live"><i class="dot"></i> LIVE</span></div>
 <div class="float-panel-body"><div class="float-status-card"><div class="between"><strong class="signal-title">${state.profitReady?'Execution completed':'Trade Channel monitor'}</strong><span class="pill ${state.profitReady?'green':'green'}">${state.profitReady?'DONE 4/4':'CONNECTED'}</span></div><div id="floatProgress" class="signal-detail">${state.profitReady?'4 positions executed · Floating P/L +$18.42':'Listening for signals from the BTECH Trade Channel.'}</div></div><div id="floatLog" class="float-log ${state.logsVisible?'':'hidden'}">${lines}</div></div>
 <div class="float-panel-footer"><span>Powered by BTECH Finance</span><button onclick="stopFromFloat()">STOP ROBOT</button></div>`;
 root.classList.add('show');
 root.style.left='';root.style.top='';root.style.right='';root.style.bottom='';
 if(state.floatPanelPos){root.style.left=state.floatPanelPos.x+'px';root.style.top=state.floatPanelPos.y+'px'}
 else{const r=root.getBoundingClientRect();root.style.left=Math.max(10,Math.min(window.innerWidth-r.width-10,window.innerWidth-r.width-14))+'px';root.style.top=Math.max(58,Math.min(window.innerHeight-r.height-20,window.innerHeight*.28))+'px'}
 attachPanelDrag();
}
function toggleFloatLogs(){state.logsVisible=!state.logsVisible;openFloat()}
function toggleSkipTrading(){state.skipTrading=!state.skipTrading;toast(state.skipTrading?'Trade execution paused for this demo':'Trade execution resumed');openFloat()}

function closeFloat(){$('floatPanel').classList.remove('show')}
function toggleFloat(){const panel=$('floatPanel');if(panel.classList.contains('show'))closeFloat();else openFloat()}
function stopFromFloat(){state.running=false;state.execution='idle';stopNativeOverlay();closeFloat();render();toast('Robot stopped')}
function clampPosition(x,y,w,h){return {x:Math.max(6,Math.min(window.innerWidth-w-6,x)),y:Math.max(6,Math.min(window.innerHeight-h-6,y))}}
function makeDraggable(element,handle,onMoved){if(!element||!handle||handle.dataset.dragReady==='1')return;handle.dataset.dragReady='1';let active=false,startX=0,startY=0,originX=0,originY=0,moved=false;handle.addEventListener('pointerdown',e=>{if(e.button!==undefined&&e.button!==0)return;if(e.target.closest('button'))return;const rect=element.getBoundingClientRect();active=true;moved=false;startX=e.clientX;startY=e.clientY;originX=rect.left;originY=rect.top;element.style.left=rect.left+'px';element.style.top=rect.top+'px';element.style.right='auto';element.style.bottom='auto';try{handle.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault()});handle.addEventListener('pointermove',e=>{if(!active)return;const dx=e.clientX-startX,dy=e.clientY-startY;if(Math.abs(dx)+Math.abs(dy)>3)moved=true;const r=clampPosition(originX+dx,originY+dy,element.offsetWidth,element.offsetHeight);element.style.left=r.x+'px';element.style.top=r.y+'px';if(onMoved)onMoved(r)});const finish=e=>{if(!active)return;active=false;if(onMoved){const rect=element.getBoundingClientRect();onMoved({x:rect.left,y:rect.top},moved)} };handle.addEventListener('pointerup',finish);handle.addEventListener('pointercancel',finish)}
function attachPanelDrag(){makeDraggable($('floatPanel'),$('floatPanelHandle'),(p,done)=>{if(done!==false)state.floatPanelPos={x:p.x,y:p.y}})}
function attachBubbleDrag(){const bubble=$('floatBubble');if(bubble.dataset.dragReady==='1')return;bubble.dataset.dragReady='1';let moved=false,down=false,sx=0,sy=0,ox=0,oy=0;bubble.addEventListener('pointerdown',e=>{if(e.button!==undefined&&e.button!==0)return;const r=bubble.getBoundingClientRect();down=true;moved=false;sx=e.clientX;sy=e.clientY;ox=r.left;oy=r.top;bubble.style.left=r.left+'px';bubble.style.top=r.top+'px';bubble.style.right='auto';bubble.style.bottom='auto';try{bubble.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault()});bubble.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>4)moved=true;const p=clampPosition(ox+dx,oy+dy,bubble.offsetWidth,bubble.offsetHeight);bubble.style.left=p.x+'px';bubble.style.top=p.y+'px';state.floatBubblePos=p});const finish=()=>{if(!down)return;down=false;if(!moved)toggleFloat()};bubble.addEventListener('pointerup',finish);bubble.addEventListener('pointercancel',()=>down=false);bubble.addEventListener('click',e=>{if(e.detail===0)toggleFloat()})}
function showModal(title,body,icon,cta,callback,kind='green',confirm=false,extra=''){const root=$('modalRoot');root.innerHTML=`<div class="modal" onclick="event.stopPropagation()"><div class="modal-icon" style="${kind==='red'?'background:var(--red-d);color:var(--red)':kind==='normal'?'background:var(--teal-d);color:var(--teal)':''}">${icon}</div><h3>${title}</h3><p>${body}</p>${extra}${confirm?`<div class="btnrow" style="margin-top:14px"><button class="btn secondary" onclick="closeModal()">CANCEL</button><button class="btn danger" id="modalCta">${cta}</button></div>`:`<button class="btn full" id="modalCta">${cta}</button>`}</div>`;root.classList.add('show');$('modalCta').onclick=callback;root.onclick=closeModal}
function closeModal(){$('modalRoot').classList.remove('show');$('modalRoot').innerHTML=''}
const steps=['New Signal XAUUSD received','Searching Symbol on the connected broker account','Symbol found — preparing trades','Waiting for broker confirmation','Execute trade XAUUSD #1/4','Execute trade XAUUSD #2/4','Execute trade XAUUSD #3/4','Execute trade XAUUSD #4/4','DONE 4/4 Executed'];
function runDemoSignal(){
 state.execution='running';state.logsVisible=true;
 const startLog=()=>{const log=$('floatLog');if(log)log.innerHTML='<div>>> LIVE: STARTED</div><div>>> NEW SIGNAL XAUUSD RECEIVED</div><div>>> SEARCHING SYMBOL</div><div class="log-good">>> SYMBOL FOUND — PREPARING TRADES</div><div>>> WAITING FOR BROKER CONFIRMATION</div>'};
 startLog();const el=$('floatProgress');if(el)el.textContent='New signal received — processing order updates…';
 let i=0;const tick=()=>{i++;const p=$('floatProgress');if(p)p.textContent=steps[Math.min(i,steps.length-1)];const log=$('floatLog');if(log){log.innerHTML += `<div>${steps[Math.min(i,steps.length-1)]}</div>`;log.scrollTop=log.scrollHeight}if(i<steps.length-1)setTimeout(tick,850);else{state.execution='done';clearTimeout(state.profitTimer);state.profitReady=false;state.profitTimer=setTimeout(()=>{state.profitReady=true;const p=$('floatProgress');if(p)p.textContent='DONE 4/4 Executed · Floating P/L +$18.42';const log=$('floatLog');if(log)log.innerHTML+='<div class="log-good">>> DONE 4/4 EXECUTED</div><div class="log-good">>> FLOATING P/L: +$18.42</div>';toast('Sample floating profit update is ready')},60000)}};
 setTimeout(tick,850);
}

function previewProfit(){state.profitReady=true;state.logsVisible=true;const p=$('floatProgress');if(p)p.textContent='DONE 4/4 Executed · Floating P/L +$18.42';const log=$('floatLog');if(log){log.classList.remove('hidden');log.innerHTML+='<div class="log-good">>> DONE 4/4 EXECUTED</div><div class="log-good">>> FLOATING P/L: +$18.42</div><div class="log-warn">>> SAMPLE PREVIEW — NOT LIVE BROKER DATA</div>'}toast('Sample profit view — live value requires broker connection')}
function goToLogs(){closeModal();go('logs')}
// Inline log route uses the same page renderer as a compact dedicated view.
const oldRender=render;
render=function(){if(state.route==='logs'){document.getElementById('shell').classList.remove('home-with-art');nav();$('app').innerHTML=`${pageHead('Execution log','Signal lifecycle from Trade Channel to broker confirmation.')}<section class="card"><div class="between"><strong>XAUUSD · BUY</strong><span class="pill green">${state.execution==='done'?'DONE':'LIVE'}</span></div><p class="hint">TP 0849.9 · SL 49484.8</p>${steps.map((s,i)=>`<div class="timeline"><span class="timeline-dot"></span><span class="timeline-copy">${s}<small>${i===0?'Signal received':i===8?'All 4 orders confirmed':'Status update from execution monitor'}</small></span></div>`).join('')}</section><section class="card" style="margin-top:12px"><div class="eyebrow">FLOATING PROFIT</div><div style="font-size:26px;font-weight:800;color:var(--green);margin:8px 0">${state.profitReady?'+$18.42':'Waiting for 60-second update'}</div><div class="hint">${state.profitReady?'4 positions · illustrative P/L':'Profit display becomes available 60 seconds after execution.'}</div></section><button class="link" onclick="go('home')">← Back to Home</button>`;return}oldRender()}
if(window.BTECHNative&&typeof window.BTECHNative.isRunning==='function'){try{state.running=!!window.BTECHNative.isRunning()}catch(_){}}document.documentElement.dataset.theme=state.themeMode;setAccent(state.accent,false);attachBubbleDrag();window.addEventListener('resize',()=>{if(state.floatBubblePos){const b=$('floatBubble'),p=clampPosition(state.floatBubblePos.x,state.floatBubblePos.y,b.offsetWidth,b.offsetHeight);b.style.left=p.x+'px';b.style.top=p.y+'px';state.floatBubblePos=p}if(state.floatPanelPos){const f=$('floatPanel'),p=clampPosition(state.floatPanelPos.x,state.floatPanelPos.y,f.offsetWidth||340,f.offsetHeight||360);f.style.left=p.x+'px';f.style.top=p.y+'px';state.floatPanelPos=p}});render();
</script>
</body>
</html>
